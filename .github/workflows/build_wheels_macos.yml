name: Build wheels (macOS)

on:
  workflow_call:
    inputs:
      build_commit:
        required: true
        type: string
      scm_version:
        required: true
        type: string

jobs:
  build_wheels:
    name: Build on macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos
            arch: arm64
            macos_target: 15.0

    steps:
      - name: Checkout kvxopt source
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/checkout@v4
        with:
          repository: 'kvxopt/kvxopt'
          ref: ${{ inputs.build_commit }}
          path: .
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout kvxopt source (PR)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Load build configuration
        shell: bash
        run: |
          source .ci/config/versions.env

          # Export all variables to GITHUB_ENV for subsequent steps
          grep '^export ' .ci/config/versions.env | sed 's/export //' >> $GITHUB_ENV
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "BUILD_COMMIT=${{ inputs.build_commit }}" >> $GITHUB_ENV

      - name: Prepare source for building
        shell: bash
        run: |
          echo "Building from commit: $(git rev-parse HEAD)"

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          # GIL-enabled cp311–cp315 and free-threaded cp314t/cp315t.
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-* cp314t-* cp315-* cp315t-*"
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.scm_version }}

          CIBW_ENVIRONMENT_MACOS: >
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_target }}
            KVXOPT_BUILD_GLPK=1
            KVXOPT_BUILD_FFTW=1
            KVXOPT_BUILD_OSQP=1
            KVXOPT_BUILD_GSL=1

          CIBW_BEFORE_ALL: bash .ci/scripts/install_dependencies.sh ${{ matrix.platform }} ${{ matrix.arch }}

      - name: Verify GIL and free-threaded wheels
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then
            PY=python3
          else
            PY=python
          fi
          "$PY" .ci/scripts/verify_wheel_tags.py ./wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl
          retention-days: 7
